databases:
  - name: jobpilot-db
    plan: free
    databaseName: jobpilot
    user: jobpilot

services:
  - type: keyvalue
    name: jobpilot-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (internal use only in this setup)

  - type: web
    name: jobpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jobpilot-redis
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: MOCK_FORM_BASE_URL
        value: https://REPLACE-WITH-YOUR-RENDER-URL.onrender.com